<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="d1red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E30613"/>
      <stop offset="100%" stop-color="#C40510"/>
    </linearGradient>
  </defs>
  <rect width="320" height="120" rx="16" fill="url(#d1red)"/>
  <!-- D1 White Badge Frame -->
  <rect x="12" y="12" width="296" height="96" rx="12" fill="none" stroke="#FFD100" stroke-width="3"/>
  <!-- Text TIENDAS -->
  <text x="160" y="38" font-family="'Outfit', 'Inter', Arial, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">TIENDAS</text>
  <!-- D1 Big Bold -->
  <g transform="translate(95, 45)">
    <!-- Letter D -->
    <text x="0" y="52" font-family="'Outfit', 'Inter', Arial Black, sans-serif" font-weight="900" font-size="62" fill="#FFD100" letter-spacing="-2">D</text>
    <!-- Number 1 -->
    <text x="58" y="52" font-family="'Outfit', 'Inter', Arial Black, sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" letter-spacing="-1">1</text>
  </g>
  <!-- Small subtext -->
  <text x="210" y="88" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FFD100" letter-spacing="1">¡De Todos!</text>
</svg>